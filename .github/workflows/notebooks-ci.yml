name: Notebooks CI

on:
  push:
    branches:
      - main
      - 'topic*'
    paths:
      - 'topic*/notebooks/**/*.ipynb'
      - '.github/workflows/notebooks-ci.yml'
      - 'requirements-ci.txt'
  pull_request:
    paths:
      - 'topic*/notebooks/**/*.ipynb'
      - '.github/workflows/notebooks-ci.yml'
      - 'requirements-ci.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Discover notebooks
        id: notebooks
        shell: bash
        run: |
          mapfile -t NOTEBOOKS < <(find . -type f -path './topic*/notebooks/*.ipynb' | sort)
          if [ ${#NOTEBOOKS[@]} -eq 0 ]; then
            echo 'No notebooks found.'
            exit 1
          fi
          printf '%s\n' "${NOTEBOOKS[@]}"
          echo "count=${#NOTEBOOKS[@]}" >> "$GITHUB_OUTPUT"

      - name: Execute every notebook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p executed-notebooks

          while IFS= read -r notebook; do
            [ -z "$notebook" ] && continue
            relative="${notebook#./}"
            target_dir="executed-notebooks/$(dirname "$relative")"
            mkdir -p "$target_dir"

            echo "::group::Executing $relative"
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              --output "$(basename "$notebook")" \
              --output-dir "$target_dir"
            echo "::endgroup::"
          done < <(find . -type f -path './topic*/notebooks/*.ipynb' | sort)

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed-notebooks/
          if-no-files-found: warn
          retention-days: 7
