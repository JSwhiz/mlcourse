name: Notebooks CI

on:
  push:
    paths:
      - 'topic*/notebooks/**/*.ipynb'
      - '.github/workflows/notebooks-ci.yml'
      - 'requirements.txt'
      - 'requirements-ci.txt'
  pull_request:
    paths:
      - 'topic*/notebooks/**/*.ipynb'
      - '.github/workflows/notebooks-ci.yml'
      - 'requirements.txt'
      - 'requirements-ci.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Discover notebooks
        shell: bash
        run: |
          mapfile -t NOTEBOOKS < <(find . -type f -path './topic*/notebooks/*.ipynb' | sort)
          if [ ${#NOTEBOOKS[@]} -eq 0 ]; then
            echo 'No notebooks found.'
            exit 1
          fi
          printf 'Discovered %s notebook(s):\n' "${#NOTEBOOKS[@]}"
          printf '  %s\n' "${NOTEBOOKS[@]}"

      - name: Execute every notebook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p executed-notebooks

          while IFS= read -r notebook; do
            [ -z "$notebook" ] && continue
            relative="${notebook#./}"
            target_dir="executed-notebooks/$(dirname "$relative")"
            mkdir -p "$target_dir"

            echo "::group::Executing $relative"
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              --output "$(basename "$notebook")" \
              --output-dir "$target_dir"
            echo "::endgroup::"
          done < <(find . -type f -path './topic*/notebooks/*.ipynb' | sort)

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks-${{ github.sha }}
          path: executed-notebooks/
          if-no-files-found: warn
          retention-days: 7
