<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<rect width="1440" height="1040" fill="#f6f8fa"/>
<rect x="70" y="45" width="1300" height="950" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<rect x="125" y="88" width="120" height="7" rx="4" fill="#0969da"/>
<text x="125" y="145" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700" fill="#1f2328">Topic 01 · NumPy Foundations</text>
<text x="125" y="180" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#59636e">Arrays · indexing · boolean masks · broadcasting · vectorization</text>
<text x="125" y="235" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1f2328">Arrays and shapes</text>
<text x="125" y="273" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#3d444d">Inspect array structure before doing numerical work.</text>
<text x="125" y="331" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#0969da">In [ ]:</text>
<rect x="205" y="307" width="1080" height="111" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="230" y="335" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">x = np.array([2, 4, 6, 8, 10])</text>
<text x="230" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">A = np.arange(1, 13).reshape(3, 4)</text>
<text x="230" y="385" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">print('shape:', A.shape, 'ndim:', A.ndim, 'dtype:', A.dtype)</text>
<text x="125" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8250df">Out:</text>
<text x="230" y="453" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">shape: (3, 4) ndim: 2 dtype: int64</text>
<text x="125" y="507" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1f2328">Boolean masks</text>
<text x="125" y="545" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#3d444d">Filter an array without an explicit Python loop.</text>
<text x="125" y="603" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#0969da">In [ ]:</text>
<rect x="205" y="579" width="1080" height="86" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="230" y="607" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">mask = A % 2 == 0</text>
<text x="230" y="632" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">print(A[mask])</text>
<text x="125" y="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8250df">Out:</text>
<text x="230" y="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">[ 2  4  6  8 10 12]</text>
<text x="125" y="754" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1f2328">Broadcasting</text>
<text x="125" y="792" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#3d444d">Combine compatible shapes directly.</text>
<text x="125" y="850" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#0969da">In [ ]:</text>
<rect x="205" y="826" width="1080" height="86" rx="8" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="230" y="854" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">row_offsets = np.array([100, 200, 300, 400])</text>
<text x="230" y="879" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">print(A + row_offsets)</text>
<text x="125" y="947" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8250df">Out:</text>
<text x="230" y="947" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f">[[101 202 303 404]</text>
<text x="230" y="971" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f"> [105 206 307 408]</text>
<text x="230" y="995" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#24292f"> [109 210 311 412]]</text>
</svg>